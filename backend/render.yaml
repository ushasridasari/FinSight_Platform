services:
  - type: web
    name: finforesight-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./finforesight.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
